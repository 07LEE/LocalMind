<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thought-Search | 3D Semantic Knowledge Graph</title>
    
    <!-- Libraries -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <!-- Mobile Header (Visible only on Mobile) -->
    <header class="mobile-header">
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <span class="mobile-logo-text">Thought-Search</span>
        <div class="mobile-header-actions">
            <button class="theme-toggle-btn" id="theme-toggle-mobile" aria-label="화면 테마 전환">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Sidebar Backdrop for Mobile -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-text">Thought-Search</span>
            <div class="header-actions">
                <button class="theme-toggle-btn" id="theme-toggle" aria-label="화면 테마 전환">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                <button class="sync-btn" id="sync-btn">Sync</button>
                <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="메뉴 닫기">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>

        <nav class="navigation-tree">
            <div class="nav-title">Documents <span id="doc-count" style="text-transform: none; font-size: 0.7rem; color: var(--text-secondary); margin-left: 4px;"></span></div>
            <div class="legend" id="legend"></div>
        </nav>
    </aside>

    <!-- Right Main Content Area -->
    <main class="main-content">
        <!-- 1. Welcome & Visualization View (Initial State) -->
        <div id="welcome-view" class="content-view">
            <!-- Top Search Engine Area -->
            <div class="main-search-section">
                <div class="main-search-box">
                    <div class="search-input-wrapper">
                        <input type="text" class="main-search-input" id="main-search-input" placeholder="Search...">
                        <button type="button" class="rag-toggle-btn" id="rag-toggle-btn" aria-label="RAG 모드 토글">
                            RAG
                        </button>
                        <button class="search-submit-btn" id="search-submit-btn" aria-label="검색 실행">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </div>
                    
                    <div class="main-search-results" id="main-search-results">
                        <div class="ai-answer-container" id="ai-answer-container" style="display: none;">
                            <div class="ai-answer-card">
                                <div class="ai-answer-header">
                                    <div class="ai-badge">AI ANSWER</div>
                                    <div class="ai-status" id="ai-status">답변 생성 중...</div>
                                </div>
                                <div class="ai-answer-body" id="ai-answer-body"></div>
                                <div class="ai-sources-section">
                                    <div class="ai-sources-title">참조 문서 (Sources)</div>
                                    <div class="ai-sources-list" id="ai-sources-list"></div>
                                </div>
                            </div>
                        </div>
                        <div class="search-results-list" id="search-results-list"></div>
                    </div>
                </div>
            </div>

            <!-- Stretched 3D Vector Plot in Framed Box -->
            <section class="viz-section">
                <div class="viz-container">
                    <div id="plot"></div>
                    
                    <button class="controls-toggle-btn" id="controls-toggle-btn" aria-label="설정 열기">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </button>
                    
                    <div class="viz-overlay-controls" id="viz-overlay-controls">
                        <div class="control-group">
                            <label>연관 밀도 (Threshold: <span id="threshold-val">0.80</span>)</label>
                            <input type="range" id="threshold-slider" min="0.50" max="0.95" step="0.01" value="0.80">
                        </div>
                        <div class="orbit-control">
                            <label class="switch">
                                <input type="checkbox" id="orbit-toggle" checked>
                                <span class="slider round"></span>
                            </label>
                            <span class="orbit-label">Auto-Orbit</span>
                        </div>
                    </div>
                    
                    <div class="hint">
                        좌클릭 드래그: 회전 | 우클릭 드래그: 이동 | 휠: 확대/축소 | 노드 클릭: 문서 열기
                    </div>
                </div>
            </section>
        </div>

        <!-- 2. Document Content View (Active State) -->
        <div id="doc-view" class="content-view" style="display: none;">
            <article class="info-panel">
                <header class="info-header">
                    <div class="info-header-left">
                        <h1 class="info-title" id="info-title">문서 제목</h1>
                        <div class="info-path" id="info-path">path/to/document.md</div>
                        <div class="info-tags" id="info-tags"></div>
                    </div>
                    <div class="info-header-right">
                        <button class="close-panel-btn" id="close-panel-btn" aria-label="문서 닫기">×</button>
                        <div class="info-dates" id="info-dates">
                            <div class="info-date-row"><span class="date-label">Created:</span><span id="info-created">-</span></div>
                            <div class="info-date-row"><span class="date-label">Modified:</span><span id="info-modified">-</span></div>
                        </div>
                    </div>
                </header>
                
                <div class="info-body">
                    <div class="info-body-left">
                        <div class="info-content" id="info-content">
                            문서 내용을 로드 중입니다...
                        </div>
                        <div class="related-section">
                            <div class="related-header">연관 지식 (Semantic Connections)</div>
                            <div class="related-list" id="related-list"></div>
                        </div>
                    </div>
                    <aside class="toc-sidebar" id="toc-sidebar">
                        <ul class="toc-list" id="toc-list"></ul>
                    </aside>
                </div>
            </article>
        </div>
    </main>

    <!-- Custom Logic -->
    <script src="script.js"></script>
</body>
</html>
